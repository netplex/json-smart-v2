name: Release and Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: false
        default: '2.6.1'
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Determine release version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="2.6.1"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --dearmor > ~/.gnupg/secring.gpg
          gpg --import ~/.gnupg/secring.gpg

      - name: Set release version in all POMs
        run: |
          # Update version in all POMs
          cd accessors-smart && ./mvnw versions:set -q -DnewVersion=${VERSION} -DgenerateBackupPoms=false
          cd ../json-smart && ./mvnw versions:set -q -DnewVersion=${VERSION} -DgenerateBackupPoms=false
          cd ../json-smart-action && ./mvnw versions:set -q -DnewVersion=${VERSION} -DgenerateBackupPoms=false
          
          # Update dependency versions between modules
          cd ../json-smart
          sed -i '/<artifactId>accessors-smart<\/artifactId>/,/<\/dependency>/ s|<version>[^<]*</version>|<version>'${VERSION}'</version>|' pom.xml
          cd ../json-smart-action  
          sed -i '/<artifactId>json-smart<\/artifactId>/,/<\/dependency>/ s|<version>[^<]*</version>|<version>'${VERSION}'</version>|' pom.xml

      - name: Release accessors-smart
        run: |
          cd accessors-smart
          ./mvnw -q clean install
          ./mvnw deploy -P release-sign-artifacts
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Release json-smart
        run: |
          cd json-smart
          ./mvnw -q clean install
          ./mvnw deploy -P release-sign-artifacts
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Release json-smart-action
        run: |
          cd json-smart-action
          ./mvnw -q clean install
          ./mvnw deploy -P release-sign-artifacts
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create git tag
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists locally."
          elif git ls-remote --tags origin "v${VERSION}" | grep -q "v${VERSION}"; then
            echo "Tag v${VERSION} already exists on remote."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v${VERSION}" -m "Release version ${VERSION}"
            git push origin "v${VERSION}"
          fi
